[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-lambda-test-harness"
version = "0.1.0"
description = "Small test harness for an LLM-driven execution Lambda"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
aws-test = [
    "boto3>=1.34",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "unit: pure unit tests",
    "functional: tests against the actual handler with mocks",
    "deployed: tests against the deployed Lambda (requires AWS)",
]